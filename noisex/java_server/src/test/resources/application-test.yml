# WebSocket E2E 集成测试配置
# 连接 Docker 中运行的服务（app:8080, mysql:3307, redis:6379）

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/noisex?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: noisex
    password: noisex123
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

noisex:
  jwt:
    secret: Y2xvZ2ljbW9kLWRlZi1rZXktZm9yLW5vaXNleC1sb2NhbC1kZXY=
    expiration: 86400000
  websocket:
    allowed-origins: "*"
  sonar:
    max-per-hour: 30
    max-content-length: 140
  room:
    lifetime-hours: 72
    unlock-threshold-messages: 10
    unlock-min-message-length: 5
  chat:
    max-message-length: 500
    msg-rate-seconds: 1
    duplicate-window-seconds: 2
  match:
    max-expand-level: 2
  encryption:
    key: local-encryption-key-change-in-prod-32b!

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.noisex: INFO
