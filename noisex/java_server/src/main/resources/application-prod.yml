server:
  port: ${SERVER_PORT:7070}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:noisex}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  flyway:
    enabled: true
    locations: classpath:db/migration

noisex:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  admin:
    jwt-expiration: ${ADMIN_JWT_EXPIRATION:7200000}
    login:
      max-attempts: ${ADMIN_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${ADMIN_LOGIN_WINDOW_SECONDS:900}
  sonar:
    max-per-hour: 3
    max-content-length: 140
    duplicate-window-seconds: 30
  room:
    lifetime-hours: 72
    unlock-window-hours: 24
    unlock-threshold-messages: 20
    unlock-min-message-length: 5
  chat:
    max-message-length: 500
    msg-rate-seconds: 2
    duplicate-window-seconds: 30
  match:
    default-geohash-precision: 6
    max-expand-level: 2
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS}
  push:
    enabled: ${PUSH_ENABLED:false}
    # 生产密钥只进服务器 /opt/noisex-api/.env（600），严禁写回代码库（见 dev 侧整改注释）
    project-id: ${PUSH_PROJECT_ID:}
    ohos:
      service-account-key-file: ${PUSH_SERVICE_ACCOUNT_KEY_FILE:}
    # 安卓 HMS 通道凭据（老 AGC 应用），同样只走服务器 .env
    android:
      project-id: ${PUSH_ANDROID_PROJECT_ID:}
      service-account-key-file: ${PUSH_ANDROID_SERVICE_ACCOUNT_KEY_FILE:}
    fcm:
      service-account-key: ${FCM_SERVICE_ACCOUNT_KEY:}
      project-id: ${FCM_PROJECT_ID:}
  encryption:
    key: ${ENCRYPTION_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.noisex: INFO
    org.springframework: WARN
    org.hibernate: WARN
