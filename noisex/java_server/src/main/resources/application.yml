server:
  port: 7070

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:noisex}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

noisex:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  admin:
    jwt-expiration: ${ADMIN_JWT_EXPIRATION:7200000}
    login:
      max-attempts: ${ADMIN_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${ADMIN_LOGIN_WINDOW_SECONDS:900}
  sonar:
    max-per-hour: 100
    max-content-length: 140
    duplicate-window-seconds: 30
  room:
    lifetime-hours: 72
    unlock-window-hours: 24
    unlock-threshold-messages: 20
    unlock-min-message-length: 5
  chat:
    max-message-length: 500
    msg-rate-seconds: 2
    duplicate-window-seconds: 30
  match:
    default-geohash-precision: 6
    max-expand-level: 2
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:7070,http://10.0.2.2:7070}
  push:
    enabled: ${PUSH_ENABLED:false}
    # 2026-11-04 v3 改造（勿回退）：HarmonyOS Push Kit REST 只认 projectId，
    # 旧 v2/{appId} 端点与 message.android.notification 安卓报文对鸿蒙应用不可用
    project-id: ${PUSH_PROJECT_ID:}
    # 鸿蒙 v3 鉴权 = 服务账号密钥自签 JWT（PS256），密钥 JSON 从 AGC API Console
    # 下载，只放服务器（600）严禁入库；client_id/client_secret 换的 OAuth token
    # 会被 v3 接口 80200001 拒（2026-11-05 实锤），勿回退
    ohos:
      service-account-key-file: ${PUSH_SERVICE_ACCOUNT_KEY_FILE:}
    # category 必须与 AGC 已批自分类权益类目一致（本应用=IM 即时聊天）；
    # 不带或错配会被按资讯营销类处理：静默通知+频控，表现为"收不到推送"
    category: ${PUSH_CATEGORY:IM}
    # 调测期置 true：测试消息不受频控（单项目每日 1000 条），通道验证后关掉
    test-message: ${PUSH_TEST_MESSAGE:false}
    # 安卓 HMS 通道（老 AGC 安卓应用）走 v2/{appId} 接口，凭据与鸿蒙 v3 是两套勿混填
    android:
      project-id: ${PUSH_ANDROID_PROJECT_ID:}
      service-account-key-file: ${PUSH_ANDROID_SERVICE_ACCOUNT_KEY_FILE:}
    fcm:
      service-account-key: ${FCM_SERVICE_ACCOUNT_KEY:}
      project-id: ${FCM_PROJECT_ID:}
  encryption:
    key: ${ENCRYPTION_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: noisex-server

logging:
  level:
    com.noisex: INFO
