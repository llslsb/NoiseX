name: noisex
description: NoiseX - Anonymous proximity-based social app
publish_to: 'none'
version: 1.0.0+1000001

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  geolocator: ^13.0.0
  flutter_svg: ^2.0.0
  intl: ^0.19.0
  pointycastle: ^3.9.0
  sqflite: ^2.3.0
  flutter_local_notifications: ^18.0.0
  huawei_push: ^6.12.0+300
  # P0-2: 短音效（声呐脉冲、消息往返、深度交流等）。资源占位见 assets/sounds/README.md
  audioplayers: ^6.0.0
  # 离线体验增强：网络状态监听
  connectivity_plus: ^6.0.0

dependency_overrides:
  # OHOS 平台适配：git 整仓 fork（自带 android/ios 原实现），TAG 钉版。
  # shared_preferences/sqflite 无适配时 MissingPluginException 会让 main() 卡白屏。
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: shared_preferences-v2.3.2-ohos-1.0.1
  # OHOS fork 的 Dart 编译器编译 web 1.1.1 报 'JSObject' isn't a type，钉到镜像最高版
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
