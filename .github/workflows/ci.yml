name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noisex/java_server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: mvn compile -q

      - name: Run tests
        run: mvn test -q
        env:
          JWT_SECRET: test-secret-key-for-ci-at-least-32-characters-long

      - name: Build JAR
        run: mvn package -DskipTests -q
        env:
          JWT_SECRET: test-secret-key-for-ci-at-least-32-characters-long

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noisex/java_server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check formatting
        run: mvn spotless:check

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noisex/flutter_app_home/flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
